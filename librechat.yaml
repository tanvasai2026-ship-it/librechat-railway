version: 1.3.14

# ============================================================================
# Personal LibreChat configuration for Railway.
# Keep ALL secrets in Railway Variables — never in this file:
#   OPENROUTER_KEY=sk-or-v1-...
#   TAVILY_API_KEY=tvly-...
#   E2B_API_KEY=e2b_...
#   OPENAI_API_KEY=sk-...        (required to activate the Assistants endpoint)
#   MONGO_URI=...
#   CREDS_KEY / CREDS_IV / JWT_SECRET / JWT_REFRESH_SECRET
# ============================================================================

cache: true

interface:
  customWelcome: "Welcome to your private AI workspace. Choose OpenRouter, select a model, and turn on Web Search or Code Interpreter whenever you need them."

  # Core UI controls
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true

  prompts:
    use: true
    create: true
    share: false
    public: false

  # Agents — on
  agents:
    use: true
    create: true
    share: false
    public: false

  # Assistants — on (this only works once OPENAI_API_KEY is set in Railway;
  # see note under "endpoints" below — Assistants is OpenAI-native and does
  # NOT run through OpenRouter)
  assistants:
    use: true
    create: true
    share: false
    public: false

  # Web Search button in the composer
  webSearch: true

  # File search / citations
  fileSearch: true
  fileCitations: true
  maxCitations: 50
  minRelevanceScore: 0.0

  # Run Code button on markdown code blocks
  runCode: true

  # Pin these tool toggles ON by default for every user/conversation.
  defaultPinnedTools:
    - "execute_code"
    - "web_search"
    - "file_search"
    - "artifacts"
    - "mcp"

  privacyPolicy:
    externalUrl: "https://librechat.ai/privacy-policy"
    openNewTab: true

  termsOfService:
    externalUrl: "https://librechat.ai/tos"
    openNewTab: true
    modalAcceptance: true
    modalTitle: "Terms of Service for My Private LibreChat"
    modalContent: |
      # Terms and Conditions

      This is a private, personal LibreChat service.

      - Do not share access credentials or API keys.
      - AI-generated output may be inaccurate. Verify important legal, medical,
        financial, tax, and compliance information with qualified sources.
      - You are responsible for activity performed through your account and
        for any third-party API usage charges.

# ============================================================================
# Custom AI endpoints
# ============================================================================
# Agent-level capabilities and citation limits.
endpoints:
  agents:
    capabilities:
      - "execute_code"
      - "file_search"
      - "web_search"
      - "artifacts"
      - "actions"
      - "context"
      - "tools"
      - "chain"
      - "ocr"
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.0
    artifacts: "auto"

  # Assistants endpoint config (cosmetic only — activation requires
  # OPENAI_API_KEY to be set in Railway Variables; without it, this
  # endpoint stays hidden regardless of interface.assistants above).
  # Assistants use OpenAI models directly (gpt-4o, gpt-4-turbo, etc.)
  # and CANNOT use OpenRouter — OpenAI's Assistants API is proprietary
  # to OpenAI and does not accept OpenRouter-routed models.
  assistants:
    disableBuilder: false
    pollIntervalMs: 3000
    timeoutMs: 180000
    retrievalModels:
      - "gpt-4-turbo-preview"
    capabilities:
      - "code_interpreter"
      - "retrieval"
      - "actions"
      - "tools"
      - "image_vision"

  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        x-librechat-body-parentmessageid: "{{LIBRECHAT_BODY_PARENTMESSAGEID}}"
      models:
        # fetch: true pulls OpenRouter's full live model catalogue so
        # ALL current OpenRouter models show up in the selector, not
        # just a curated shortlist.
        fetch: true
        # Fallback list used only if the live fetch fails at startup.
        default:
          - "openai/gpt-4o-mini"
          - "anthropic/claude-sonnet-4"
          - "google/gemini-2.5-flash"
          - "qwen/qwen3-32b"
          - "meta-llama/llama-3.3-70b-instruct:free"
      titleConvo: true
      titleModel: "openai/gpt-4o-mini"
      summarize: false
      dropParams:
        - "stop"
      modelDisplayLabel: "OpenRouter"

# ============================================================================
# Web Search — Tavily as both search provider and page scraper
# ============================================================================
webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
  logResult: false
  tavilySearchOptions:
    searchDepth: "advanced"
    maxResults: 10

