version: 1.3.14

# ============================================================================
# Personal LibreChat configuration for Railway.
# Keep ALL secrets in Railway Variables — never in this file:
#   OPENROUTER_KEY=sk-or-v1-...
#   TAVILY_API_KEY=tvly-...
#   E2B_API_KEY=e2b_...
#   MONGO_URI=...
#   CREDS_KEY / CREDS_IV / JWT_SECRET / JWT_REFRESH_SECRET
# ============================================================================

cache: true

interface:
  customWelcome: "Welcome to your private AI workspace. Choose OpenRouter, select a model, and turn on Web Search or Code Interpreter whenever you need them."

  # Core UI controls
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true

  prompts:
    use: true
    create: true
    share: false
    public: false

  agents:
    use: true
    create: true
    share: false
    public: false

  # Web Search button in the composer
  webSearch: true

  # File search / citations
  fileSearch: true
  fileCitations: true
  maxCitations: 50
  minRelevanceScore: 0.0

  # Run Code button on markdown code blocks
  runCode: true

  # Pin these tool toggles ON by default for every user/conversation.
  # This is the "global button" behavior — Code Interpreter, Web Search,
  # File Search, and Artifacts show up pinned in the composer without
  # anyone needing to manually enable them each time.
  defaultPinnedTools:
    - "execute_code"
    - "web_search"
    - "file_search"
    - "artifacts"

  privacyPolicy:
    externalUrl: "https://librechat.ai/privacy-policy"
    openNewTab: true

  termsOfService:
    externalUrl: "https://librechat.ai/tos"
    openNewTab: true
    modalAcceptance: true
    modalTitle: "Terms of Service for My Private LibreChat"
    modalContent: |
      # Terms and Conditions

      This is a private, personal LibreChat service.

      - Do not share access credentials or API keys.
      - AI-generated output may be inaccurate. Verify important legal, medical,
        financial, tax, and compliance information with qualified sources.
      - You are responsible for activity performed through your account and
        for any third-party API usage charges.

# ============================================================================
# Custom AI endpoints
# ============================================================================
endpoints:
  # Agent-level capabilities and citation limits.
  # "execute_code" enables Code Interpreter for Agents once a backend
  # (E2B via MCP, or LIBRECHAT_CODE_BASEURL) is connected.
  agents:
    capabilities:
      - "execute_code"
      - "file_search"
      - "web_search"
      - "artifacts"
      - "actions"
      - "context"
      - "tools"
      - "chain"
      - "ocr"
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.0

  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      headers:
        x-librechat-body-parentmessageid: "{{LIBRECHAT_BODY_PARENTMESSAGEID}}"
      models:
        fetch: false
        default:
          - "openai/gpt-4o-mini"
          - "anthropic/claude-sonnet-4"
          - "google/gemini-2.5-flash"
          - "qwen/qwen3-32b"
          - "meta-llama/llama-3.3-70b-instruct:free"
      titleConvo: true
      titleModel: "openai/gpt-4o-mini"
      summarize: false
      dropParams:
        - "stop"
      modelDisplayLabel: "OpenRouter"

# ============================================================================
# Grouped model shortcuts in the model selector (organized by vendor)
# ============================================================================
modelSpecs:
  enforce: false
  prioritize: true
  list:
    - name: "GPT-4o mini"
      label: "GPT-4o mini"
      description: "Fast, low-cost model for everyday writing and summaries."
      group: "OpenAI"
      groupIcon: "openAI"
      default: true
      preset:
        endpoint: "OpenRouter"
        model: "openai/gpt-4o-mini"
        modelLabel: "GPT-4o mini"

    - name: "Claude Sonnet"
      label: "Claude Sonnet"
      description: "Higher-capability reasoning, long-form drafting, complex work."
      group: "Anthropic"
      groupIcon: "anthropic"
      preset:
        endpoint: "OpenRouter"
        model: "anthropic/claude-sonnet-4"
        modelLabel: "Claude Sonnet"

    - name: "Gemini Flash"
      label: "Gemini Flash"
      description: "Fast model for travel planning, large documents, logistics."
      group: "Google"
      groupIcon: "google"
      preset:
        endpoint: "OpenRouter"
        model: "google/gemini-2.5-flash"
        modelLabel: "Gemini Flash"

    - name: "Qwen 32B"
      label: "Qwen 32B"
      description: "Cost-efficient research and structured analysis."
      group: "Qwen"
      preset:
        endpoint: "OpenRouter"
        model: "qwen/qwen3-32b"
        modelLabel: "Qwen 32B"

    - name: "Llama 3.3 70B (Free)"
      label: "Llama 3.3 70B (Free)"
      description: "Free option; may be rate-limited or temporarily unavailable."
      group: "Free Models"
      preset:
        endpoint: "OpenRouter"
        model: "meta-llama/llama-3.3-70b-instruct:free"
        modelLabel: "Llama 3.3 70B (Free)"

# ============================================================================
# Web Search — Tavily as both search provider and page scraper
# ============================================================================
webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
  logResult: false
  tavilySearchOptions:
    searchDepth: "advanced"
    maxResults: 10

# ============================================================================
# MCP Servers — E2B Code Interpreter
# Requires E2B_API_KEY set in Railway Variables on the LibreChat service.
# Attach the "e2b" tool to an Agent (Add MCP Server Tools) to use it,
# or rely on the pinned "execute_code" default above once wired to an agent.
# ============================================================================
mcpServers:
  e2b:
    type: stdio
    command: npx
    args:
      - "-y"
      - "@e2b/mcp-server"
    env:
      E2B_API_KEY: "${E2B_API_KEY}"
    timeout: 120000
