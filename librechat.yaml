version: 1.3.1

# Personal LibreChat configuration for Railway.
# Keep secrets in Railway Variables, not in this file:
# OPENROUTER_KEY=sk-or-v1-...
# TAVILY_API_KEY=tvly-...

interface:
  customWelcome: "Welcome to your private AI workspace. Choose OpenRouter, select a model, and enable Web Search when you need current information."
  modelSelect: true
  parameters: true
  presets: true
  prompts: true
  bookmarks: true
  temporaryChat: true
  contextUsage: true
  contextCost: true

  # Display the Web Search control in the chat composer.
  webSearch: true

  # Display file search controls where supported by your installed LibreChat services.
  fileSearch: true

  # Allow source citations from file-search/RAG results where supported.
  fileCitations: true

  privacyPolicy:
    externalUrl: "https://librechat.ai/privacy-policy"
    openNewTab: true

  termsOfService:
    externalUrl: "https://librechat.ai/tos"
    openNewTab: true
    modalAcceptance: true
    modalTitle: "Terms of Service for My Private LibreChat"
    modalContent: |
      # Terms and Conditions

      This is a private, personal LibreChat service.

      - Do not share access credentials or API keys.
      - Do not upload confidential information unless you understand the privacy and retention implications of each connected AI provider.
      - AI-generated output may be inaccurate. Verify important legal, medical, financial, tax, compliance, and other high-impact information with qualified sources.
      - You are responsible for activity performed through your account and for any third-party API usage charges.

# OpenRouter is the only AI-model endpoint configured here.
# The API key is read securely from Railway's OPENROUTER_KEY variable.
endpoints:
  custom:
    - name: "OpenRouter"
      apiKey: "${OPENROUTER_KEY}"
      baseURL: "https://openrouter.ai/api/v1"
      models:
        fetch: true
        default:
          - "openai/gpt-4o-mini"
          - "google/gemini-2.5-flash"
          - "qwen/qwen3-32b"
          - "anthropic/claude-sonnet-4"
      titleConvo: true
      titleModel: "openai/gpt-4o-mini"
      summarize: false

# Built-in Web Search configuration.
# Tavily is used for both search and page extraction. The actual key stays in Railway.
webSearch:
  searchProvider: "tavily"
  scraperProvider: "tavily"
  tavilyApiKey: "${TAVILY_API_KEY}"
  logResult: false

interface:
  # Enables the interactive "Run Code" play button on markdown blocks
  runCode: true
  fileCitations: true

interface:
  fileCitations: true
  # Lower constraints to make sure nothing gets hidden or dropped
  maxCitations: 50            # Ensure a high threshold
  minRelevanceScore: 0.0      # Set to 0.0 so NO sources are filtered out

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  tavilyApiKey: "${TAVILY_API_KEY}"
  tavilySearchOptions:
    searchDepth: "advanced"   # Forces Tavily to do a deep dive dive and pass more URLs
    maxResults: 10            # Increases the pool of URLs passed to the text model
